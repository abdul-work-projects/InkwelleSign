# fly launch --no-deploy   then   fly deploy
app = "inkwell-esign"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  INKWELL_DATA_DIR = "/data"
  # Demo workspace on first boot, plus the passwordless Test sign in button.
  # Remove both for a real deployment.
  SEED_ON_START = "1"
  DEMO_LOGIN = "on"
  # Set APP_URL to the deployed hostname so signing links are correct:
  #   fly secrets set APP_URL=https://inkwell-esign.fly.dev

[[mounts]]
  source = "inkwell_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1   # keep one machine so the volume stays attached
